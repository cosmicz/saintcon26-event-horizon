<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1110" viewBox="0 0 480 1110" role="img" aria-labelledby="title desc">
  <title id="title">Two cores, one picture: the torus frame plan</title>
  <desc id="desc">Core zero transforms even parts and core one transforms odd parts. A barrier completes geometry before rasterisation. The 360 by 360 framebuffer is split into eight 45-row bands: even bands on core zero, odd bands on core one. Each core reuses its own 360 by 45 depth buffer for four bands. A second barrier finishes the image before display transfer.</desc>
  <defs>
    <style>
      text { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; fill: #e9e7f2; }
      .small { font-size: 15px; fill: #b9b6cc; }
      .label { font-size: 18px; }
      .phase { font-size: 18px; font-weight: bold; letter-spacing: 1px; }
      .even { fill: #ffab75; }
      .odd { fill: #b8a1ff; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0 6 3 0 6" fill="none" stroke="#b9b6cc" stroke-width="1.5"/></marker>
  </defs>
  <rect width="480" height="1110" rx="14" fill="#0c0c16"/>
  <text x="240" y="37" text-anchor="middle" class="phase">TORUS · ONE FRAME</text>
  <text x="240" y="72" text-anchor="middle" class="label">Pass 1 · transform geometry</text>
  <rect x="20" y="95" width="210" height="106" rx="8" fill="#34201e" stroke="#ffab75"/>
  <rect x="250" y="95" width="210" height="106" rx="8" fill="#25203e" stroke="#b8a1ff"/>
  <text x="125" y="127" text-anchor="middle" class="label even">CORE 0</text>
  <text x="355" y="127" text-anchor="middle" class="label odd">CORE 1</text>
  <text x="125" y="158" text-anchor="middle" class="small">Parts 0 · 2 · 4 · 6</text>
  <text x="355" y="158" text-anchor="middle" class="small">Parts 1 · 3 · 5 · 7</text>
  <text x="125" y="183" text-anchor="middle" class="small">Vertex ranges</text>
  <text x="355" y="183" text-anchor="middle" class="small">Vertex ranges</text>
  <path d="M125 208V239 M355 208V239" stroke="#b9b6cc" marker-end="url(#arrow)"/>
  <path d="M28 250H452" stroke="#e9e7f2" stroke-width="3"/>
  <text x="240" y="276" text-anchor="middle" class="small">BARRIER · geometry must be complete</text>
  <text x="240" y="322" text-anchor="middle" class="label">Pass 2 · rasterise row bands</text>
  <text x="240" y="351" text-anchor="middle" class="small">One 360 × 360 RGB565 framebuffer</text>
  <g stroke="#0c0c16" stroke-width="2">
    <path d="M60 370h360v45H60Z" fill="#533127"/>
    <path d="M60 415h360v45H60Z" fill="#39305c"/>
    <path d="M60 460h360v45H60Z" fill="#533127"/>
    <path d="M60 505h360v45H60Z" fill="#39305c"/>
    <path d="M60 550h360v45H60Z" fill="#533127"/>
    <path d="M60 595h360v45H60Z" fill="#39305c"/>
    <path d="M60 640h360v45H60Z" fill="#533127"/>
    <path d="M60 685h360v45H60Z" fill="#39305c"/>
  </g>
  <g text-anchor="middle" class="label">
    <text x="240" y="399" class="even">Band 0 · core 0</text>
    <text x="240" y="444" class="odd">Band 1 · core 1</text>
    <text x="240" y="489" class="even">Band 2 · core 0</text>
    <text x="240" y="534" class="odd">Band 3 · core 1</text>
    <text x="240" y="579" class="even">Band 4 · core 0</text>
    <text x="240" y="624" class="odd">Band 5 · core 1</text>
    <text x="240" y="669" class="even">Band 6 · core 0</text>
    <text x="240" y="714" class="odd">Band 7 · core 1</text>
  </g>
  <text x="240" y="762" text-anchor="middle" class="small">Disjoint writes · 45 rows per band</text>
  <rect x="20" y="788" width="210" height="113" rx="8" fill="#34201e" stroke="#ffab75"/>
  <rect x="250" y="788" width="210" height="113" rx="8" fill="#25203e" stroke="#b8a1ff"/>
  <text x="125" y="817" text-anchor="middle" class="label even">Core 0 depth</text>
  <text x="355" y="817" text-anchor="middle" class="label odd">Core 1 depth</text>
  <text x="125" y="845" text-anchor="middle" class="label">360 × 45 × 2 B</text>
  <text x="355" y="845" text-anchor="middle" class="label">360 × 45 × 2 B</text>
  <text x="125" y="875" text-anchor="middle" class="small">Reuse for 0 → 2 → 4 → 6</text>
  <text x="355" y="875" text-anchor="middle" class="small">Reuse for 1 → 3 → 5 → 7</text>
  <text x="240" y="933" text-anchor="middle" class="label">64,800 B of depth scratch in total</text>
  <text x="240" y="959" text-anchor="middle" class="small">¼ of a full-screen 16-bit depth buffer</text>
  <path d="M28 987H452" stroke="#e9e7f2" stroke-width="3"/>
  <text x="240" y="1015" text-anchor="middle" class="small">BARRIER · both cores finish this pass</text>
  <path d="M240 1030V1055" stroke="#b9b6cc" marker-end="url(#arrow)"/>
  <text x="240" y="1086" text-anchor="middle" class="label">Finish frame → LCD transfer</text>
</svg>
